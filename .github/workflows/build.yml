# Builds Penguin cpp and runs its tests on Ubuntu 24.04, the base of Linux
# Mint 22, with the same packages the README asks for.
name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lazarus, Free Pascal and the C/C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lazarus fpc lcl-qt5-3.0 lcl-nogui-3.0 libqt5pas-dev \
            gcc g++ gdb make python3

      - name: Build the IDE (Qt5, Release and Debug), with no warnings or notes
        run: |
          set -o pipefail # a failed build fails the step, through tee
          lazbuild -B --ws=qt5 Source/penguin-cpp.lpi | tee build-release.log
          lazbuild -B --ws=qt5 --bm=Debug Source/penguin-cpp.lpi | tee build-debug.log
          test -x penguin-cpp && test -x penguin-cpp-debug
          # Warnings and notes of the IDE's own units (not Lazarus' packages)
          if grep -E "Source/.*\) (Warning|Note):" build-release.log build-debug.log; then
            echo "The IDE should build with no warnings or notes"
            exit 1
          fi

      - name: C++ parser
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/ParserTest/build.sh --run

      - name: Operating system layer
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/PlatformTest/build.sh --run

      - name: GDB/MI reader
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/GdbMITest/build.sh --run

      - name: Debugger engine with gdb
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/GdbEngineTest/build.sh --run

      - name: Debugger engine with lldb-dap (macOS; skipped where there is none)
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/DapEngineTest/build.sh --run

      - name: Project Makefiles with make and gcc
        run: FPCFLAGS="-Cr -Co -Ct -CR -Sa -gh -gl" Source/Tests/MakefileTest/build.sh --run

      - name: Forms (.lfm) against their classes
        run: WS=nogui Source/Tests/LfmCheck/check.sh

      - name: C++ code folding
        run: WS=nogui Source/Tests/FoldTest/build.sh --run

      - name: Build the .deb package and check it with lintian
        run: |
          sudo apt-get install -y --no-install-recommends dpkg-dev lintian
          packaging/build-deb.sh --no-build

      - name: Install the package
        run: |
          sudo apt-get install -y ./build/deb/penguin-cpp_*.deb
          test -L /usr/bin/penguin-cpp
          test -f /usr/share/penguin-cpp/Lang/English.lng
          test -f /usr/share/applications/penguin-cpp.desktop
          sudo apt-get install -y --no-install-recommends desktop-file-utils man-db xvfb strace
          desktop-file-validate /usr/share/applications/penguin-cpp.desktop
          man -w penguin-cpp

      - name: The installed IDE starts and reads its files from /usr/share
        run: |
          # Runs for 15 seconds (124 is timeout's code), then the trace must
          # show the language file read from the installed folder (Free
          # Pascal calls open, not openat)
          set +e
          xvfb-run -a strace -f -e trace=open,openat -o trace.log timeout 15 penguin-cpp > run.log 2>&1
          CODE=$?
          set -e
          cat run.log
          test $CODE -eq 124
          if grep -q "Penguin cpp: E" run.log; then exit 1; fi # an unhandled error
          grep -c 'penguin-cpp' trace.log
          grep '/usr/share/penguin-cpp/Lang/English.lng' trace.log | grep -v ENOENT

      - name: Remove the package without leaving files behind
        run: |
          sudo apt-get remove -y penguin-cpp
          for P in /usr/bin/penguin-cpp /usr/lib/penguin-cpp /usr/share/penguin-cpp \
                   /usr/share/fonts/truetype/penguin-cpp /usr/share/applications/penguin-cpp.desktop; do
            if [ -e "$P" ]; then echo "left behind: $P"; exit 1; fi
          done

      - name: The APT repository installs the package (signed with a throwaway key)
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils gnupg
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "Penguin cpp test <test@invalid>" ed25519 sign never
          # Where apt's unprivileged user (_apt) can read it, the key where
          # users put it
          REPO=$(mktemp -d /tmp/apt-repo.XXXXXX)
          chmod 755 "$REPO"
          packaging/update-apt-repo.sh "$REPO" build/deb/*.deb
          sudo install -m 644 "$REPO/penguin-cpp.gpg" /usr/share/keyrings/penguin-cpp-test.gpg
          echo "deb [signed-by=/usr/share/keyrings/penguin-cpp-test.gpg] file:$REPO stable main" | sudo tee /etc/apt/sources.list.d/penguin-cpp-test.list
          sudo apt-get update
          apt-cache policy penguin-cpp
          sudo apt-get install -y penguin-cpp
          test -x /usr/lib/penguin-cpp/penguin-cpp
          sudo apt-get remove -y penguin-cpp
          sudo rm /etc/apt/sources.list.d/penguin-cpp-test.list /usr/share/keyrings/penguin-cpp-test.gpg

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: penguin-cpp-deb
          path: build/deb/*.deb

      # The packaged program has no symbols, so the error report on the
      # user's desktop has only addresses: this same build, with its
      # symbols, turns them into files and lines (addr2line -f -C -e penguin-cpp ADDRESS...)
      - name: Check that the build kept its symbols
        run: file penguin-cpp | tee /dev/stderr | grep -q "with debug_info"

      - name: Keep the program with its symbols
        uses: actions/upload-artifact@v4
        with:
          name: penguin-cpp-symbols
          path: penguin-cpp
